<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        /* Spring Physics Animations */
        @keyframes popIn {
            0% { transform: scale(0.95) translateY(20px); opacity: 0; }
            70% { transform: scale(1.02) translateY(-5px); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        @keyframes floatSlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        @keyframes wavePulse {
            0% { height: 4px; opacity: 0.5; }
            50% { height: 24px; opacity: 1; }
            100% { height: 4px; opacity: 0.5; }
        }
        
        @keyframes wavePulse2 {
            0% { height: 8px; opacity: 0.3; }
            50% { height: 32px; opacity: 0.8; }
            100% { height: 8px; opacity: 0.3; }
        }

        .animate-pop-in {
            animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .animate-bg-float {
            animation: floatSlow 20s ease-in-out infinite alternate;
        }

        .wave-bar {
            animation: wavePulse 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .wave-bar-bg {
            animation: wavePulse2 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }
        
        .wave-bar:nth-child(2n) { animation-delay: 0.1s; animation-duration: 0.8s; }
        .wave-bar:nth-child(3n) { animation-delay: 0.2s; animation-duration: 1.2s; }
        .wave-bar:nth-child(5n) { animation-delay: 0.3s; animation-duration: 0.9s; }
        .wave-bar:nth-child(7n) { animation-delay: 0.15s; animation-duration: 1.1s; }

        .wave-bar-bg:nth-child(2n) { animation-delay: 0.2s; animation-duration: 1.1s; }
        .wave-bar-bg:nth-child(3n) { animation-delay: 0.4s; animation-duration: 1.4s; }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(28, 28, 30, 0.4);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .control-pod {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.2),
                inset 0 0 20px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 32px;
        }

        .play-btn-glow {
            box-shadow: 0 0 30px rgba(255,255,255,0.3), inset 0 2px 4px rgba(255,255,255,0.5);
        }

        /* Custom Range Input Styling for Volume/Scrubber */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -5px; 
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
        }
        input[type=range]:hover::-webkit-slider-thumb,
        input[type=range]:active::-webkit-slider-thumb {
            opacity: 1;
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1px;
        }
        
        .volume-track {
            background: linear-gradient(to right, #ffffff 75%, rgba(255, 255, 255, 0.2) 75%);
        }

        .bleed-mask {
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        .oversized-time {
            font-size: 140px;
            font-weight: 900;
            letter-spacing: -0.05em;
            color: rgba(255,255,255,0.03);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

    </style>
