<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        /* Spring Physics Animations */
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom Range Input Styling for Volume/Scrubber */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -5px; 
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
        }
        input[type=range]:hover::-webkit-slider-thumb,
        input[type=range]:active::-webkit-slider-thumb {
            opacity: 1;
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1px;
        }
        
        /* Fill effect for range input (using JS or CSS hack, keeping simple here with gradient) */
        .scrubber-track {
            background: linear-gradient(to right, #ffffff 45%, rgba(255, 255, 255, 0.2) 45%);
        }
        .volume-track {
            background: linear-gradient(to right, #ffffff 75%, rgba(255, 255, 255, 0.2) 75%);
        }

    </style>

<body class="bg-background-pure text-on-surface h-screen w-screen overflow-hidden font-body-md select-none">
<!-- Immersive Dynamic Background -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden flex items-center justify-center">
<!-- The background uses a blurred, saturated version of the album art for ambient lighting -->
<div class="absolute w-[150%] h-[150%] bg-cover bg-center opacity-60 mix-blend-screen scale-150 blur-[100px] saturate-[200%] transform-gpu" data-alt="Abstract, highly saturated fluid gradient art mimicking the essence of a futuristic, dark electronic music album cover. Swirling neon purples, deep blacks, and electric blues blend together in a soft, ethereal cloud. The mood is deep, immersive, and high-fidelity, perfect for a premium audio interface background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAlW0pF_i29HE2BE0_wGsWwbHfGi2HnS9eMMuXs5e4K5loFFkQX4jc0QSqSdtyCmmcGhsRLdeH1wA9levIPdqiF5lmMczcZ8FSL4h3NwPE8F-9Xa7oLFtbHLsy28C7rHaIWzIx_HRXTxpAPhBj0J6mAYnSRNSs-pa_J0EqhAoQmfrV074hXrJsG4OYxoPoCEz9o2kSwyd0WjFpiBgznzgMD0dt5WOSRPOLSx20BPeEbZWLsSFINfuDzGQ')">
</div>
<!-- Dark overlay to ensure text readability -->
<div class="absolute inset-0 bg-background-pure/40 bg-gradient-to-t from-background-pure via-transparent to-background-pure/30"></div>
</div>
<!-- Main Player Container -->
<div class="relative z-10 flex flex-col h-full w-full max-w-md mx-auto px-margin-mobile pt-safe-top pb-safe-bottom">
<!-- Top App Bar (Minimalist) -->
<!-- Suppressing global nav (BottomNav/Drawer) because this is a focused, full-screen transactional/modal view -->
<header class="flex justify-between items-center py-4 w-full bg-transparent">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full text-on-surface hover:bg-surface-variant/50 active:scale-95 transition-transform duration-200 ease-out">
<span class="material-symbols-outlined text-[28px]" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</button>
<div class="flex flex-col items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Now Playing</span>
<span class="font-label-md text-label-md font-semibold text-on-surface">Playlist / Electronic</span>
</div>
<button aria-label="More options" class="p-2 -mr-2 rounded-full text-on-surface hover:bg-surface-variant/50 active:scale-95 transition-transform duration-200 ease-out">
<span class="material-symbols-outlined text-[28px]" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Album Art Canvas -->
<main class="flex-1 flex flex-col items-center justify-center w-full py-stack-lg">
<div class="relative w-full aspect-square max-w-[340px] rounded-2xl overflow-hidden shadow-[0px_24px_48px_rgba(0,0,0,0.8)] border border-white/10 animate-pop-in group">
<img alt="Album Artwork" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105" data-alt="A striking, high-contrast album cover artwork featuring a sleek, glowing geometric structure suspended in absolute darkness. The structure emits sharp neon purple and cyan lighting, casting subtle reflections on a glossy, obsidian surface below. The aesthetic is premium, futuristic, and purely audiophile, conveying incredible depth and clarity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDRpxTMa5MvUP9TYTNSPE4iIGmDxvvTctHY5-BOqHxDMgoejPaYqFp4vis3HKphCabJybuL5mxiVhK8tDoI_sey3m4Zp5IzQp7eO-c_tWehhOxwWm4uhO-oU1sYIoVbKD6-e5QLWaF7-UQbsfZR1Lbf8mTs4UCr2dOi6-MZ-MUu8Mg-hZ5PrkKjiWMLs0luCqNSdYmwEssO2WNd9x5ACth2uP_F3JvGnaqzdzteIcftnYys28oGYwPJlA"/>
<!-- Inner glass glare effect -->
<div class="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/5 to-white/20 pointer-events-none"></div>
</div>
<!-- Track Info -->
<div class="w-full flex flex-col items-start mt-10 mb-2">
<div class="flex justify-between items-end w-full">
<div class="flex flex-col flex-1 pr-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface truncate pb-1">Midnight Resonance</h1>
<h2 class="font-headline-md text-headline-md text-on-surface-variant truncate">Aura Synthetica</h2>
</div>
<button aria-label="Add to favorites" class="p-2 rounded-full text-on-surface hover:text-danger active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="favorite_border">favorite_border</span>
</button>
</div>
<!-- Quality Badge (Hi-Res Lossless) -->
<div class="mt-stack-sm flex items-center gap-2 px-2 py-1 rounded-full border border-hi-res bg-hi-res/10">
<span class="font-label-sm text-label-sm text-hi-res uppercase">Hi-Res Lossless</span>
<span class="material-symbols-outlined text-[12px] text-hi-res" data-icon="graphic_eq" data-weight="fill">graphic_eq</span>
</div>
</div>
</main>
<!-- Controls Section -->
<footer class="w-full pb-8 flex flex-col gap-6">
<!-- Progress Bar -->
<div class="w-full flex flex-col gap-2">
<div class="flex justify-between items-center px-1">
<span class="font-label-sm text-label-sm text-on-surface-variant">2:45</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">-1:32</span>
</div>
<div class="relative w-full h-4 flex items-center">
<input aria-label="Seek track" class="scrubber-track absolute w-full z-10" max="100" min="0" type="range" value="45"/>
</div>
</div>
<!-- Main Playback Controls -->
<div class="flex items-center justify-between w-full px-2">
<button aria-label="Shuffle" class="p-2 text-on-surface-variant hover:text-on-surface active:scale-95 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="shuffle">shuffle</span>
</button>
<div class="flex items-center justify-center gap-6">
<button aria-label="Previous track" class="p-3 text-on-surface-variant hover:text-on-surface active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-[36px]" data-icon="skip_previous" data-weight="fill">skip_previous</span>
</button>
<!-- Primary Play Button (Solid White) -->
<button aria-label="Play" class="w-16 h-16 bg-on-surface rounded-full flex items-center justify-center text-background-pure shadow-[0_0_20px_rgba(255,255,255,0.2)] active:scale-90 transition-transform duration-200 ease-out">
<span class="material-symbols-outlined text-[36px] ml-1" data-icon="play_arrow" data-weight="fill">play_arrow</span>
</button>
<button aria-label="Next track" class="p-3 text-on-surface-variant hover:text-on-surface active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-[36px]" data-icon="skip_next" data-weight="fill">skip_next</span>
</button>
</div>
<button aria-label="Repeat" class="p-2 text-on-surface-variant hover:text-on-surface active:scale-95 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="repeat">repeat</span>
</button>
</div>
<!-- Volume Control -->
<div class="flex items-center gap-3 w-full mt-2 px-2">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant" data-icon="volume_down">volume_down</span>
<div class="relative w-full h-4 flex items-center flex-1">
<input aria-label="Adjust volume" class="volume-track absolute w-full z-10" max="100" min="0" type="range" value="75"/>
</div>
<span class="material-symbols-outlined text-[20px] text-on-surface-variant" data-icon="volume_up">volume_up</span>
</div>
<!-- Bottom Actions -->
<div class="flex justify-between items-center w-full mt-4 px-4 opacity-70">
<button aria-label="Connect device" class="p-2 flex items-center gap-2 text-on-surface hover:opacity-100 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px]" data-icon="speaker_group">speaker_group</span>
<span class="font-label-sm text-label-sm">Living Room...</span>
</button>
<button aria-label="Lyrics" class="p-2 text-on-surface hover:opacity-100 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px]" data-icon="lyrics">lyrics</span>
</button>
</div>
</footer>
</div>
</body></html>
